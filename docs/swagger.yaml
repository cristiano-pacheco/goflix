basePath: /
definitions:
  dto.ActivateUserRequest:
    properties:
      token:
        type: string
      user_id:
        type: integer
    type: object
  dto.CreateSubscriptionRequest:
    properties:
      plan_id:
        type: integer
    type: object
  dto.CreateSubscriptionResponse:
    properties:
      auto_renew:
        type: boolean
      end_date:
        type: string
      plan_id:
        type: integer
      start_date:
        type: string
      status:
        type: string
      subscription_id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  dto.CreateUserResponse:
    properties:
      email:
        type: string
      name:
        type: string
      user_id:
        type: integer
    type: object
  dto.FindUserResponse:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  dto.GenerateTokenRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.GenerateTokenResponse:
    properties:
      token:
        type: string
    type: object
  dto.IsUserSubscriptionActiveResponse:
    properties:
      is_active:
        type: boolean
    type: object
  dto.ListSubscriptionsResponse:
    properties:
      subscriptions:
        items:
          $ref: '#/definitions/dto.SubscriptionResponse'
        type: array
    type: object
  dto.SubscriptionResponse:
    properties:
      auto_renew:
        type: boolean
      end_date:
        type: string
      plan_id:
        type: integer
      start_date:
        type: string
      status:
        type: string
      subscription_id:
        type: integer
      user_id:
        type: integer
    type: object
  dto.UpdateUserRequest:
    properties:
      name:
        type: string
      password:
        type: string
    type: object
  errs.Error:
    properties:
      error:
        $ref: '#/definitions/errs.er'
    type: object
  errs.detail:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  errs.er:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/errs.detail'
        type: array
      message:
        type: string
    type: object
info:
  contact: {}
  description: Go modulith API
  title: Go modulith API
  version: 0.0.1
paths:
  /api/v1/auth/token:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns an access token
      parameters:
      - description: Login credentials (email and password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.GenerateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully generated token
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.GenerateTokenResponse'
            type: object
        "400":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      summary: Generate authentication token
      tags:
      - Authentication
  /api/v1/subscriptions:
    get:
      consumes:
      - application/json
      description: Retrieves all subscriptions for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved subscriptions
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.ListSubscriptionsResponse'
            type: object
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      security:
      - BearerAuth: []
      summary: List user subscriptions
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: Creates a new subscription for the authenticated user
      parameters:
      - description: Subscription data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created subscription
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.CreateSubscriptionResponse'
            type: object
        "400":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "422":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      security:
      - BearerAuth: []
      summary: Create subscription
      tags:
      - Subscriptions
  /api/v1/subscriptions/active:
    get:
      consumes:
      - application/json
      description: Checks if the authenticated user has an active subscription
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved subscription status
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.IsUserSubscriptionActiveResponse'
            type: object
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      security:
      - BearerAuth: []
      summary: Check user subscription status
      tags:
      - Subscriptions
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Creates a new user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created user
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.CreateUserResponse'
            type: object
        "422":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      summary: Create user
      tags:
      - Users
  /api/v1/users/activate:
    post:
      consumes:
      - application/json
      description: Activates an existing user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ActivateUserRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Successfully activated user
        "400":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      summary: Activate user
      tags:
      - Users
  /api/v1/users/me:
    get:
      consumes:
      - application/json
      description: Finds an existing user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Successfully found user
          schema:
            properties:
              data:
                $ref: '#/definitions/dto.FindUserResponse'
            type: object
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      security:
      - BearerAuth: []
      summary: Find user
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Updates an existing user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/errs.Error'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/errs.Error'
        "422":
          description: Invalid request format or validation error
          schema:
            $ref: '#/definitions/errs.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errs.Error'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Enter your bearer token in the format **Bearer <token>**
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
